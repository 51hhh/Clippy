[package]
name = "clippy-capture"
version = "0.2.0"
description = "Clippy 的截图、贴图像素与编辑文档"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
png = "0.17"
resvg = "0.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
