[package]
name = "clippy-platform"
version = "0.2.0"
description = "Clippy 的部署身份与跨平台系统能力边界"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
arboard = "3"
clippy-core = { path = "../clippy-core" }
dirs = "7"
global-hotkey = "0.10"
image = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
ashpd = { version = "0.13", features = ["global_shortcuts", "remote_desktop", "screencast", "screenshot"] }
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
futures-util = { version = "0.3", default-features = false }
libwayshot-xcap = "0.3"
log = "0.4"
pipewire = { version = "0.9", features = ["v0_3_34"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
url = "2"
x11rb = { version = "0.14", features = ["image", "randr", "xfixes"] }
zbus = "6"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
auto-launch = "0.6"
enigo = { version = "0.6", default-features = false }
xcap = { version = "0.9", features = ["wgc"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSPasteboard", "NSRunningApplication", "NSWorkspace", "std",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
