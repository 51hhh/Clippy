[package]
name = "clippy-platform"
version = "0.2.0"
description = "Clippy 的部署身份与跨平台系统能力边界"
edition = "2021"
license = "MIT"
publish = false

[features]
macos-recording-audio = [
    "dep:objc2-av-foundation",
    "dep:objc2-core-audio-types",
    "objc2-core-media/CMFormatDescription",
    "objc2-core-media/objc2-core-audio-types",
    "objc2-foundation/NSBundle",
]

[dependencies]
anyhow = "1"
arboard = "3"
clippy-core = { path = "../clippy-core" }
dirs = "7"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false }
raw-window-handle = { version = "0.6", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
ashpd = { version = "0.13", features = ["file_chooser", "global_shortcuts", "raw_handle", "remote_desktop", "screencast", "screenshot", "wayland"] }
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
futures-util = { version = "0.3", default-features = false }
libwayshot-xcap = "0.3"
log = "0.4"
memmap2 = "0.9"
nix = { version = "0.30", default-features = false, features = ["time"] }
pipewire = { version = "0.9", features = ["v0_3_34"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.19", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
url = "2"
wayland-client = "0.31"
x11rb = { version = "0.13", features = ["image", "randr", "xfixes", "xtest"] }
zbus = "5"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
auto-launch = "0.5"
enigo = { version = "0.6", default-features = false }
rfd = { version = "0.16", default-features = false }
xcap = { version = "0.9", features = ["wgc"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libloading = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSPasteboard", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace", "std",
] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"], optional = true }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["CoreAudioBaseTypes"], optional = true }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFCGTypes", "objc2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "CGDirectDisplay", "CGDisplayConfiguration", "CGEvent", "CGEventSource", "CGEventTypes", "CGWindow",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "CMSampleBuffer", "CMSync", "CMTime", "objc2", "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "CVPixelBuffer", "CVPixelBufferIOSurface", "objc2-io-surface",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSArray", "NSDictionary", "NSError", "NSProcessInfo", "NSString", "NSValue", "std",
] }
objc2-io-surface = { version = "0.3", default-features = false, features = [
    "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2", "objc2-core-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "=0.1.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-media = { version = "0.3", default-features = false, features = ["CMBase", "CMBlockBuffer"] }
