[package]
name = "clippy-media"
version = "0.2.0"
description = "Clippy 有界媒体时间线、编码与恢复"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
recording-vp9-prototype = ["dep:shiguredo_libvpx", "dep:webm", "dep:yuv"]
recording-vp9-source-build = ["recording-vp9-prototype", "shiguredo_libvpx/source-build"]
recording-opus-webm = ["recording-vp9-prototype", "dep:opusic-c", "dep:opusic-sys"]
recording-linux-audio = ["dep:anyhow", "dep:nix", "dep:pipewire"]
recording-macos-audio = ["clippy-platform/macos-recording-audio", "recording-macos-resampling"]
recording-macos-resampling = ["dep:rubato"]
recording-windows-audio = ["dep:windows"]
recording-playback-native = ["recording-opus-webm"]
recording-playback-native-stream = [
    "recording-playback-native",
    "dep:coreaudio-rs",
    "dep:cpal",
    "dep:libpulse-sys",
    "dep:objc2-core-audio",
    "dep:objc2-core-audio-types",
    "dep:rtrb",
]
recording-playback-gstreamer = [
    "recording-vp9-prototype",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
]

[dependencies]
clippy-platform = { path = "../clippy-platform" }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
log = "0.4"
opusic-c = { version = "=1.6.1", default-features = false, optional = true }
opusic-sys = { version = "=0.7.5", default-features = false, features = ["bundled"], optional = true }
rtrb = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shiguredo_libvpx = { version = "=2026.2.0-canary.1", optional = true }
thiserror = "2"
webm = { version = "=2.2.1", optional = true }
yuv = { version = "=0.8.19", default-features = false, features = ["avx", "sse", "rdm", "professional_mode"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = { version = "1", optional = true }
libpulse-sys = { version = "=1.23.0", optional = true }
nix = { version = "0.30", features = ["time"], optional = true }
pipewire = { version = "0.9", features = ["v0_3_34"], optional = true }

[target.'cfg(any(all(target_os = "windows", target_env = "msvc"), all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
shiguredo_libvpx = { version = "=2026.2.0-canary.1", optional = true, features = ["source-build"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "=0.14.2", default-features = false, features = ["audio_toolbox"], optional = true }
objc2-core-audio = { version = "0.3", default-features = false, features = ["HostTime"], optional = true }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["CoreAudioBaseTypes"], optional = true }
# 带限 sinc 不使用 FFT 或日志，避免引入未用的采样路径。
rubato = { version = "=5.0.0", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "=0.18.2", default-features = false, optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
rubato = { version = "=5.0.0", default-features = false }
tempfile = "3"
