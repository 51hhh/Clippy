[package]
name = "clippy-storage"
version = "0.2.0"
description = "Clippy 的 SQLite 持久化与搜索适配器"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
clippy-capture = { path = "../clippy-capture" }
clippy-core = { path = "../clippy-core" }
clippy-platform = { path = "../clippy-platform" }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zip = { version = "9.0.5", default-features = false }

[dev-dependencies]
tempfile = "3"
