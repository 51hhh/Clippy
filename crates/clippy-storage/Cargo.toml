[package]
name = "clippy-storage"
version = "0.2.0"
description = "Clippy 的 SQLite 持久化与搜索适配器"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
clippy-core = { path = "../clippy-core" }
clippy-platform = { path = "../clippy-platform" }
log = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
