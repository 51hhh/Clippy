[package]
name = "clippy-ocr-worker"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
clippy-ocr-protocol = { path = "../../crates/clippy-ocr-protocol" }
image = { version = "0.25", default-features = false }
oar-ocr = { version = "=0.11.0", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-24", "load-dynamic"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = "symbols"
