[package]
name = "clippy-slint"
version = "0.2.0"
description = "Clippy native Slint desktop application"
authors = ["zhongweixi2000"]
edition = "2021"
license = "MIT"
build = "build.rs"
autobins = false
default-run = "clippy-slint"

[[bin]]
name = "clippy-slint"
path = "src/bin/clippy-slint.rs"

[[bin]]
name = "clippy-slint-qa"
path = "src/bin/clippy-slint-qa.rs"
required-features = ["qa-build"]

[features]
default = []
qa-build = []

[dependencies]
anyhow = "1"
clippy-capture = { path = "../../crates/clippy-capture" }
clippy-core = { path = "../../crates/clippy-core" }
clippy-platform = { path = "../../crates/clippy-platform" }
clippy-storage = { path = "../../crates/clippy-storage" }
image = { version = "0.25", default-features = false, features = ["png"] }
slint = { version = "=1.19.0", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-18",
    "renderer-femtovg",
    "std",
    "system-tray",
    "unstable-winit-030",
] }
tempfile = "3"

[build-dependencies]
slint-build = { version = "=1.19.0", default-features = false, features = ["compat-1-18"] }
