name = "clippy"
product-name = "Clippy"
version = "0.2.0"
identifier = "com.clippy.app"
description = "Native clipboard history, screen capture and pinned workspace"
homepage = "https://github.com/51hhh/Clippy"
authors = ["zhongweixi2000"]
license-file = "../../LICENSE"
out-dir = "../../target/packager/slint-release"
binaries-dir = "../../target/packager/slint-binaries"
binaries = [{ path = "clippy-app", main = true }]
icons = [
  "../legacy-tauri/native/icons/32x32.png",
  "../legacy-tauri/native/icons/128x128.png",
  "../legacy-tauri/native/icons/icon.ico",
  "../legacy-tauri/native/icons/icon.icns",
]
resources = [
  { src = "../../target/packager/slint-ocr", target = "ocr" },
  { src = "../../LICENSE", target = "licenses/Clippy-MIT.txt" },
  { src = "third-party-licenses/LicenseRef-Slint-Royalty-free-2.0.md", target = "licenses/LicenseRef-Slint-Royalty-free-2.0.md" },
  { src = "../legacy-tauri/native/assets/fonts/OFL-1.1.txt", target = "licenses/NotoSansCJK-OFL-1.1.txt" },
  { src = "../legacy-tauri/native/third-party-licenses/shiguredo_libvpx-2026.2.0-canary.1.txt", target = "licenses/shiguredo_libvpx-2026.2.0-canary.1.txt" },
  { src = "../legacy-tauri/native/third-party-licenses/webm-2.2.1-MPL-2.0.txt", target = "licenses/webm-2.2.1-MPL-2.0.txt" },
  { src = "../legacy-tauri/native/third-party-licenses/libwebm-2.2.1-BSD-3-Clause.txt", target = "licenses/libwebm-2.2.1-BSD-3-Clause.txt" },
  { src = "../legacy-tauri/native/third-party-licenses/libvpx-1.16.0-BSD-3-Clause.txt", target = "licenses/libvpx-1.16.0-BSD-3-Clause.txt" },
  { src = "../legacy-tauri/native/third-party-licenses/yuv-0.8.19-BSD-3-Clause.txt", target = "licenses/yuv-0.8.19-BSD-3-Clause.txt" },
  { src = "../legacy-tauri/native/third-party-licenses/opusic-c-1.6.1-BSD-3-Clause.txt", target = "licenses/opusic-c-1.6.1-BSD-3-Clause.txt" },
  { src = "../legacy-tauri/native/third-party-licenses/opusic-sys-0.7.5-libopus-1.6.1-BSD-3-Clause.txt", target = "licenses/opusic-sys-0.7.5-libopus-1.6.1-BSD-3-Clause.txt" },
  { src = "../legacy-tauri/native/third-party-licenses/recording-opus-webm-NOTICE.md", target = "licenses/recording-opus-webm-NOTICE.md" },
  { src = "../legacy-tauri/native/third-party-licenses/recording-vp9-prototype-NOTICE.md", target = "licenses/recording-vp9-prototype-NOTICE.md" },
]

[deb]
package-name = "clippy"
depends = ["libc6", "libfontconfig1", "libgcc-s1", "libstdc++6", "libpipewire-0.3-0 | libpipewire-0.3-0t64", "libgbm1", "libegl1", "libxkbcommon-x11-0"]

[appimage]
libs = ["libxkbcommon.so.0", "libxkbcommon-x11.so.0", "libxcb-xkb.so.1"]

[macos]
minimum-system-version = "11.0"
signing-identity = "-"
background-app = true
info-plist-path = "../../target/packager/slint-release-info.plist"

[windows]
allow-downgrades = false
