name: CI Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 发布基线是 Ubuntu 22.04。默认依赖图不得启用可选的 linux-pipewire，
        # 从 Jammy 构建可保证产物不会意外要求更高版本的 glibc 或 PipeWire 头文件。
        runner: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config xvfb x11-utils \
            libgbm-dev libegl-dev libdrm-dev libwayland-dev libxcb1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        run: cd src && npm ci

      - name: Rust format check
        run: cd src-tauri && cargo fmt -- --check

      - name: Rust check
        run: cd src-tauri && cargo check --all-targets

      - name: Verify Ubuntu 22 dependency baseline
        run: |
          if cd src-tauri && cargo tree --target x86_64-unknown-linux-gnu -e normal | grep -q 'pipewire v'; then
            echo '::error::Default Linux dependency graph must not include pipewire-rs'
            exit 1
          fi

      - name: Rust clippy
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: GNOME extension check
        run: ./scripts/check-gnome-extension.sh

      - name: Frontend tests
        run: cd src && npx vitest run

      - name: DOM/Xvfb smoke
        run: ./scripts/smoke-dom.sh

      - name: Frontend typecheck
        run: cd src && npx tsc --noEmit

      - name: Frontend build
        run: cd src && npx vite build

  native-check:
    name: Native Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Native Rust check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Native Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
