name: CI Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 发布基线是 Ubuntu 22.04。默认依赖图不得启用可选的 linux-pipewire，
        # 从 Jammy 构建可保证产物不会意外要求更高版本的 glibc 或 PipeWire 头文件。
        runner: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config xvfb x11-utils xdg-utils \
            libgbm-dev libegl-dev libdrm-dev libwayland-dev libxcb1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # runner 名是发行基线的一部分；Linux 不能复用较新 glibc 主机生成的 target。
          prefix-key: v1-rust
          key: ${{ matrix.runner }}
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        run: cd src && npm ci

      - name: Rust format check
        run: cd src-tauri && cargo fmt -- --check

      - name: Rust check
        run: cd src-tauri && cargo check --all-targets

      - name: Verify Ubuntu 22 dependency baseline
        run: |
          if cd src-tauri && cargo tree --target x86_64-unknown-linux-gnu -e normal | grep -q 'pipewire v'; then
            echo '::error::Default Linux dependency graph must not include pipewire-rs'
            exit 1
          fi

      - name: Rust clippy
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: GNOME extension check
        run: ./scripts/check-gnome-extension.sh

      - name: Frontend tests
        run: cd src && npx vitest run

      - name: DOM/Xvfb smoke
        run: ./scripts/smoke-dom.sh

      - name: Frontend typecheck
        run: cd src && npx tsc --noEmit

      - name: Frontend build
        run: cd src && npx vite build

  native-check:
    name: Native Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.runner }}
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        working-directory: src
        run: npm ci

      - name: Native Rust check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Native Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Native Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Native frontend tests
        working-directory: src
        run: npx vitest run

      - name: Native frontend typecheck
        working-directory: src
        run: npx tsc --noEmit

      - name: Native frontend build
        working-directory: src
        run: npx vite build

      # 普通 CI 没有 updater 私钥或发布证书，但仍必须真正跑过 Tauri bundler；
      # --no-sign 只跳过平台代码签名，tauri.ci.conf.json 只关闭 updater 附加产物，
      # Windows 的 NSIS/MSI 与 macOS 的 app/DMG 目标仍来自各自的平台配置。
      - name: Native Tauri bundle smoke
        timeout-minutes: 30
        run: npx --prefix src tauri build --ci --no-sign --config src-tauri/tauri.ci.conf.json

      - name: Verify Windows bundle outputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $nsis = Get-ChildItem "$bundle/nsis" -File -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem "$bundle/msi" -File -Filter "*.msi" -ErrorAction SilentlyContinue
          if (-not $nsis) { throw "Native CI did not generate an NSIS installer" }
          if (-not $msi) { throw "Native CI did not generate an MSI installer" }

      - name: Verify macOS bundle outputs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit | grep -q .
          find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit | grep -q .
