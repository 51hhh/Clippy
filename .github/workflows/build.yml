name: CI Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config xvfb xauth xclip x11-utils xdg-utils \
            libgbm-dev libegl-dev libdrm-dev libwayland-dev libxcb1-dev \
            libpipewire-0.3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Jammy 是发布基线，缓存键不能与更高 glibc 的 Linux runner 共用。
          prefix-key: v1-rust
          key: ubuntu-22.04
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        working-directory: src
        run: npm ci

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Verify Windows WGC cursor patch
        run: node scripts/verify-xcap-patch.mjs

      - name: Vendored xcap format check
        working-directory: src-tauri
        run: cargo fmt --manifest-path vendor/xcap/Cargo.toml -- --check

      - name: Rust check
        working-directory: src-tauri
        run: |
          cargo check --all-targets
          cargo check --no-default-features --lib

      - name: Verify PipeWire fast-path baseline
        run: |
          TREE="$(cd src-tauri && cargo tree --target x86_64-unknown-linux-gnu -e normal)"
          if ! grep -q 'pipewire v' <<<"$TREE"; then
            echo '::error::Default Linux build must include pipewire-rs fast path'
            exit 1
          fi
          if ! grep -Eq 'libspa v.*\(.*vendor/libspa\)' <<<"$TREE"; then
            echo '::error::Default Linux build must use the Jammy-compatible vendored libspa patch'
            exit 1
          fi

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: X11 clipboard isolated protocol tests
        run: ./scripts/test-x11-clipboard.sh

      - name: GNOME extension check
        run: ./scripts/check-gnome-extension.sh

      - name: Frontend HTML and Tauri boundaries
        run: node scripts/check-html-sinks.mjs

      - name: IPC contract check
        run: node scripts/check-ipc-contract.mjs

      - name: Frontend tests
        working-directory: src
        run: npx vitest run

      - name: Vanilla JS static check
        working-directory: src
        run: npm run lint:js

      - name: DOM/Xvfb smoke
        run: ./scripts/smoke-dom.sh

      - name: Frontend typecheck
        working-directory: src
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: src
        run: npx vite build

  native-check:
    name: Native Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.runner }}
          workspaces: src-tauri

      # 前端门禁只需在 Jammy 执行一次；原生 runner 专注验证 cfg 分支、平台 API 与测试。
      - name: Native Rust check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Native Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Vendored xcap WGC clippy
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo clippy --manifest-path vendor/xcap/Cargo.toml --lib --features wgc -- -D warnings

      - name: Vendored xcap macOS clippy
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo clippy --manifest-path vendor/xcap/Cargo.toml --lib -- -D warnings

      - name: Native Rust tests
        working-directory: src-tauri
        run: cargo test

  recording-codec-prototype:
    name: Recording Codec Prototype (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            features: recording-vp9-prototype
          - runner: windows-latest
            features: recording-vp9-source-build
          - runner: macos-15
            features: recording-vp9-prototype
          - runner: macos-15-intel
            features: recording-vp9-source-build
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libgbm-dev libegl-dev libdrm-dev libwayland-dev \
            libxcb1-dev libpipewire-0.3-dev xvfb xauth

      - name: Install macOS Intel source-build dependencies
        if: matrix.runner == 'macos-15-intel'
        run: brew install nasm

      - name: Install Windows source-build shell dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: make diffutils perl nasm

      - name: Expose Windows source-build shell tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo '${{ steps.msys2.outputs.msys2-location }}\usr\bin' >> $env:GITHUB_PATH

      - name: Install Windows MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-recording-codec
          key: ${{ matrix.runner }}-${{ matrix.features }}
          workspaces: src-tauri

      - name: Verify pinned codec supply chain
        run: node scripts/verify-recording-codec-supply-chain.mjs

      - name: Prototype Rust clippy
        working-directory: src-tauri
        run: cargo clippy --features ${{ matrix.features }} --all-targets -- -D warnings

      - name: Prototype VP9 mux tests
        working-directory: src-tauri
        run: cargo test --features ${{ matrix.features }} --lib recording::mux::vp9_webm::tests

      - name: Prototype VP9 session and recovery tests
        working-directory: src-tauri
        run: cargo test --features ${{ matrix.features }} --lib recording::session::tests::vp9_

      - name: Prototype X11 capture to VP9 session
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: xvfb-run -a env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=x11 cargo test --features ${{ matrix.features }} recording::benchmark::tests::x11_vp9_benchmark_runs_the_production_capture_pipeline -- --ignored --exact --test-threads=1
