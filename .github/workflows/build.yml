name: CI Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config xvfb x11-utils xdg-utils \
            libgbm-dev libegl-dev libdrm-dev libwayland-dev libxcb1-dev \
            libpipewire-0.3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Jammy 是发布基线，缓存键不能与更高 glibc 的 Linux runner 共用。
          prefix-key: v1-rust
          key: ubuntu-22.04
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        working-directory: src
        run: npm ci

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Rust check
        working-directory: src-tauri
        run: |
          cargo check --all-targets
          cargo check --no-default-features --lib

      - name: Verify PipeWire fast-path baseline
        run: |
          TREE="$(cd src-tauri && cargo tree --target x86_64-unknown-linux-gnu -e normal)"
          if ! grep -q 'pipewire v' <<<"$TREE"; then
            echo '::error::Default Linux build must include pipewire-rs fast path'
            exit 1
          fi
          if ! grep -Eq 'libspa v.*\(.*vendor/libspa\)' <<<"$TREE"; then
            echo '::error::Default Linux build must use the Jammy-compatible vendored libspa patch'
            exit 1
          fi

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: GNOME extension check
        run: ./scripts/check-gnome-extension.sh

      - name: Frontend tests
        working-directory: src
        run: npx vitest run

      - name: DOM/Xvfb smoke
        run: ./scripts/smoke-dom.sh

      - name: Frontend typecheck
        working-directory: src
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: src
        run: npx vite build

  native-check:
    name: Native Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.runner }}
          workspaces: src-tauri

      # 前端门禁只需在 Jammy 执行一次；原生 runner 专注验证 cfg 分支、平台 API 与测试。
      - name: Native Rust check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Native Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Native Rust tests
        working-directory: src-tauri
        run: cargo test
