name: CI Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      legacy_recording_prototype:
        description: '显式运行 legacy 录屏原型矩阵（新版默认不编译 Tauri）'
        required: false
        type: boolean
        default: false

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libfontconfig1-dev libxkbcommon-dev \
            libwayland-dev libxcb1-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Jammy 是发布基线，缓存键不能与更高 glibc 的 Linux runner 共用。
          prefix-key: v1-rust
          key: ubuntu-22.04
          workspaces: . -> target

      - name: Rust format check
        run: cargo fmt -p clippy-core -p clippy-platform -p clippy-storage -p clippy-slint -- --check

      - name: Shared Rust check
        run: cargo check --locked -p clippy-core -p clippy-platform -p clippy-storage --all-targets

      - name: Shared Rust clippy
        run: cargo clippy --locked -p clippy-core -p clippy-platform -p clippy-storage --all-targets -- -D warnings

      - name: Shared Rust tests
        run: cargo test --locked -p clippy-core -p clippy-platform -p clippy-storage

      - name: Slint Rust check
        run: cargo check --locked -p clippy-slint --all-targets

      - name: Slint Rust clippy
        run: cargo clippy --locked -p clippy-slint --all-targets -- -D warnings

      - name: Slint Rust tests
        run: cargo test --locked -p clippy-slint

      - name: Slint QA profile tests
        run: cargo test --locked -p clippy-slint --features qa-build

      # rustsec/audit-check 依赖 GitHub Checks API，workflow_dispatch 下会留下 queued check
      # 并以 404 终止 job；直接执行固定版本，让审计退出码成为唯一门禁结果。
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --root target/cargo-audit

      - name: Rust dependency audit
        run: target/cargo-audit/bin/cargo-audit audit

  native-check:
    name: Native Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.runner }}
          workspaces: . -> target

      - name: Shared Rust check
        run: cargo check --locked -p clippy-core -p clippy-platform -p clippy-storage --all-targets

      - name: Shared Rust clippy
        run: cargo clippy --locked -p clippy-core -p clippy-platform -p clippy-storage --all-targets -- -D warnings

      - name: Shared Rust tests
        run: cargo test --locked -p clippy-core -p clippy-platform -p clippy-storage

      - name: Slint Rust check
        run: cargo check --locked -p clippy-slint --all-targets

      - name: Slint Rust clippy
        run: cargo clippy --locked -p clippy-slint --all-targets -- -D warnings

      - name: Slint Rust tests
        run: cargo test --locked -p clippy-slint

      - name: Slint QA profile tests
        run: cargo test --locked -p clippy-slint --features qa-build

  recording-codec-prototype:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_recording_prototype
    name: Recording Codec Prototype (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            features: recording-wayland-qa,recording-linux-av-qa
            cache_key: wayland-linux-av
          - runner: windows-latest
            features: recording-windows-av-qa
            cache_key: windows-av
          - runner: macos-15
            features: recording-macos-av-qa
            cache_key: macos-arm-av
          - runner: macos-15-intel
            features: recording-macos-av-qa,recording-vp9-source-build
            cache_key: macos-intel-av
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libgbm-dev libegl-dev libdrm-dev libwayland-dev \
            libxcb1-dev libpipewire-0.3-dev xvfb xauth

      - name: Install macOS Intel source-build dependencies
        if: matrix.runner == 'macos-15-intel'
        run: brew install nasm

      - name: Install Windows source-build shell dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          update: false
          install: make diffutils perl nasm

      - name: Expose Windows source-build shell tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo '${{ steps.msys2.outputs.msys2-location }}\usr\bin' >> $env:GITHUB_PATH

      - name: Install Windows MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          components: clippy, llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-recording-codec
          # Cargo feature lists contain commas, which are forbidden in cache keys.
          key: ${{ matrix.runner }}-${{ matrix.cache_key }}
          workspaces: . -> target

      - name: Verify pinned codec supply chain
        run: node scripts/verify-recording-codec-supply-chain.mjs

      - name: Prototype Rust clippy
        working-directory: apps/legacy-tauri/native
        run: cargo clippy --features ${{ matrix.features }} --all-targets -- -D warnings

      - name: Prototype VP9 mux tests
        working-directory: apps/legacy-tauri/native
        run: cargo test --features ${{ matrix.features }} --lib recording::mux::vp9_webm::tests

      - name: Prototype Opus WebM contract tests
        working-directory: apps/legacy-tauri/native
        run: cargo test --features ${{ matrix.features }} --lib recording::mux::opus_webm::tests

      - name: Prototype recoverable A/V session tests
        working-directory: apps/legacy-tauri/native
        run: |
          cargo test --features ${{ matrix.features }} --lib recording::av -- --test-threads=1
          cargo test --features ${{ matrix.features }} --lib recording::manager::tests

      - name: Prototype VP9 session and recovery tests
        working-directory: apps/legacy-tauri/native
        run: cargo test --features ${{ matrix.features }} --lib recording::session::tests::vp9_

      - name: Windows WASAPI audio contract tests
        if: runner.os == 'Windows'
        working-directory: apps/legacy-tauri/native
        run: cargo test --features ${{ matrix.features }} --lib recording::platform::windows_audio

      - name: Prototype X11 capture to VP9 session
        if: runner.os == 'Linux'
        working-directory: apps/legacy-tauri/native
        run: xvfb-run -a env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_SESSION_TYPE=x11 cargo test --features ${{ matrix.features }} recording::benchmark::tests::x11_vp9_benchmark_runs_the_production_capture_pipeline -- --ignored --exact --test-threads=1
