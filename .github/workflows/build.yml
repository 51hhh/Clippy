name: CI Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 只保留 ubuntu-24.04：截图依赖 xcap 0.9，它必然拉 pipewire/libspa 0.9，
        # 而 libspa 0.9 无条件使用 spa_video_info_raw.flags（pipewire ≥ 0.3.65 才有）。
        # jammy 仓库里只有 0.3.48，bindgen 生成的结构体缺字段，libspa 根本编译不过。
        # 用 PPA 换新头文件会让二进制与 22.04 上的运行时 ABI 不一致，比不支持更危险。
        runner: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config xvfb x11-utils \
            libpipewire-0.3-dev \
            libgbm-dev libegl-dev libdrm-dev libwayland-dev libxcb1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        run: cd src && npm ci

      - name: Rust format check
        run: cd src-tauri && cargo fmt -- --check

      - name: Rust check
        run: cd src-tauri && cargo check --all-targets

      - name: Rust clippy
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        run: cd src-tauri && cargo test

      - name: Frontend tests
        run: cd src && npx vitest run

      - name: DOM/Xvfb smoke
        run: ./scripts/smoke-dom.sh

      - name: Frontend typecheck
        run: cd src && npx tsc --noEmit

      - name: Frontend build
        run: cd src && npx vite build
