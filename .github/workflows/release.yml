name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Tag & Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_route.outputs.version }}
      backend: ${{ steps.release_route.outputs.backend }}
      framework: ${{ steps.release_route.outputs.framework }}
      framework_version: ${{ steps.release_route.outputs.framework_version }}
      excluded_framework: ${{ steps.release_route.outputs.excluded_framework }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install Rust for manifest validation
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0

      - name: Resolve release backend
        id: release_route
        run: >-
          node scripts/resolve-release-backend.mjs
          "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify release versions and changelog
        env:
          RELEASE_BACKEND: ${{ steps.release_route.outputs.backend }}
          TAG_VERSION: ${{ steps.release_route.outputs.version }}
        run: |
          if [ "$RELEASE_BACKEND" != "legacy-tauri" ]; then
            node scripts/slint-release.mjs check "v$TAG_VERSION"
            if ! grep -Fqx "## v${TAG_VERSION}" CHANGELOG.md; then
              echo "::error::CHANGELOG.md is missing the exact heading: ## v${TAG_VERSION}"
              exit 1
            fi
            exit 0
          fi

          CONF_VERSION=$(jq -r '.version' apps/legacy-tauri/native/tauri.conf.json)
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path apps/legacy-tauri/native/Cargo.toml \
            | jq -r '.packages[] | select(.name == "clippy-app") | .version')

          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json ($CONF_VERSION)"
            exit 1
          fi
          if [ -z "$CARGO_VERSION" ] || [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          if ! grep -Fqx "## v${TAG_VERSION}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing the exact heading: ## v${TAG_VERSION}"
            exit 1
          fi

      - name: Verify tag is on main or dev branch
        run: |
          TAG_SHA=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$TAG_SHA" origin/main 2>/dev/null || \
             git merge-base --is-ancestor "$TAG_SHA" origin/dev 2>/dev/null; then
            echo "Tag is on main or dev branch"
          else
            echo "::error::Release tag is not reachable from main or dev"
            exit 1
          fi

  release-preflight:
    name: Check CI & Signing Readiness
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      windows_signing_mode: ${{ steps.release_options.outputs.windows_signing_mode }}
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Verify native CI passed for tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/verify-native-ci.mjs
          --repo "${{ github.repository }}"
          --sha "$GITHUB_SHA"

      - name: Resolve release targets and signing policy
        id: release_options
        env:
          RELEASE_BACKEND: ${{ needs.check-version.outputs.backend }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          missing_updater=()
          if [ "$RELEASE_BACKEND" = "legacy-tauri" ]; then
            for required in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
              if [ -z "${!required:-}" ]; then
                missing_updater+=("$required")
              fi
            done
          fi
          if [ "${#missing_updater[@]}" -ne 0 ]; then
            printf '::error::Missing required updater secret: %s\n' "${missing_updater[@]}"
            exit 1
          fi

          if [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo 'windows_signing_mode=certificate' >> "$GITHUB_OUTPUT"
          elif [ -z "$WINDOWS_CERTIFICATE" ] && [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo '::warning::Windows release will use an ephemeral self-signed certificate'
            echo 'windows_signing_mode=self-signed' >> "$GITHUB_OUTPUT"
          else
            echo '::error::WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be configured together'
            exit 1
          fi

  build-linux:
    if: needs.check-version.outputs.backend == 'legacy-tauri'
    name: Build (${{ matrix.label }})
    needs: [check-version, release-preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 是 Linux 发行基线；同一个产物必须保留 PipeWire 低延迟主路径。
        include:
          - runner: ubuntu-22.04
            label: ubuntu22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config squashfs-tools xdg-utils \
            libgbm-dev libegl-dev libdrm-dev libwayland-dev libxcb1-dev \
            libpipewire-0.3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0

      - name: Verify PipeWire fast-path baseline
        run: |
          TREE="$(cd apps/legacy-tauri/native && cargo tree --target x86_64-unknown-linux-gnu -e normal)"
          if ! grep -q 'pipewire v' <<<"$TREE"; then
            echo '::error::Default Linux build must include pipewire-rs fast path'
            exit 1
          fi
          if ! grep -Eq 'libspa v.*\(.*vendor/libspa\)' <<<"$TREE"; then
            echo '::error::Default Linux build must use the Jammy-compatible vendored libspa patch'
            exit 1
          fi

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: release-${{ matrix.label }}
          workspaces: . -> target
          cache-all-crates: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: cd apps/legacy-tauri/frontend && npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config apps/legacy-tauri/native/tauri.linux.conf.json

      - name: Verify release binary links PipeWire
        run: |
          BINARY="target/release/clippy-app"
          if ! readelf -d "$BINARY" | grep -q 'libpipewire-0.3.so.0'; then
            echo '::error::Linux release binary does not link the PipeWire fast-path runtime'
            exit 1
          fi

      - name: Finalize portable AppImage
        env:
          APP_VERSION: ${{ needs.check-version.outputs.version }}
          REQUIRE_TAURI_SIGNATURE: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE_SRC="target/release/bundle/appimage/Clippy_${APP_VERSION}_amd64.AppImage"
          ./scripts/finalize-appimage.sh "$APPIMAGE_SRC"

      - name: Normalize Linux artifact names
        run: |
          VER="${{ needs.check-version.outputs.version }}"
          LABEL="${{ matrix.label }}"
          BUNDLE_DIR="target/release/bundle"
          mkdir -p dist-artifacts

          DEB_SRC="${BUNDLE_DIR}/deb/Clippy_${VER}_amd64.deb"
          [ -f "$DEB_SRC" ] || { echo '::error::DEB was not generated'; exit 1; }
          cp "$DEB_SRC" "dist-artifacts/Clippy_${VER}_amd64.deb"
          cp "$DEB_SRC" "dist-artifacts/Clippy_${VER}_amd64_${LABEL}.deb"

          APPIMAGE_SRC="${BUNDLE_DIR}/appimage/Clippy_${VER}_amd64.AppImage"
          [ -f "$APPIMAGE_SRC" ] || { echo '::error::AppImage was not generated'; exit 1; }
          cp "$APPIMAGE_SRC" "dist-artifacts/Clippy_${VER}_amd64.AppImage"
          cp "$APPIMAGE_SRC" "dist-artifacts/Clippy_${VER}_amd64_${LABEL}.AppImage"

          APPIMAGE_SIG="${APPIMAGE_SRC}.sig"
          [ -s "$APPIMAGE_SIG" ] || { echo '::error::AppImage updater signature was not generated'; exit 1; }
          cp "$APPIMAGE_SIG" "dist-artifacts/Clippy_${VER}_amd64.AppImage.sig"
          cp "$APPIMAGE_SIG" "dist-artifacts/Clippy_${VER}_amd64_${LABEL}.AppImage.sig"

          DEB_SIG="${BUNDLE_DIR}/deb/Clippy_${VER}_amd64.deb.sig"
          [ ! -f "$DEB_SIG" ] || cp "$DEB_SIG" "dist-artifacts/Clippy_${VER}_amd64.deb.sig"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux-x64
          path: dist-artifacts/*
          if-no-files-found: error

  build-windows:
    if: needs.check-version.outputs.backend == 'legacy-tauri'
    name: Build (Windows x64)
    needs: [check-version, release-preflight]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: release-windows-x64
          workspaces: . -> target
          cache-all-crates: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/legacy-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd apps/legacy-tauri/frontend && npm ci

      - name: Prepare Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1

      - name: Build Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config apps/legacy-tauri/native/tauri.windows.conf.json --config apps/legacy-tauri/native/tauri.windows.signing.conf.json

      - name: Normalize Windows artifact names
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null

          $nsis = Get-ChildItem target -Recurse -File -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer was not generated" }
          Copy-Item $nsis.FullName "dist-artifacts/Clippy_$env:APP_VERSION`_x64-setup.exe"
          if (-not (Test-Path "$($nsis.FullName).sig")) { throw "NSIS updater signature was not generated" }
          Copy-Item "$($nsis.FullName).sig" "dist-artifacts/Clippy_$env:APP_VERSION`_x64-setup.exe.sig"

          $msi = Get-ChildItem target -Recurse -File -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI installer was not generated" }
          Copy-Item $msi.FullName "dist-artifacts/Clippy_$env:APP_VERSION`_x64.msi"

          foreach ($artifact in @($nsis, $msi)) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status.ToString() -ne "Valid") {
              throw "Invalid Authenticode signature on $($artifact.Name): $($signature.Status)"
            }
            if (-not $signature.SignerCertificate) {
              throw "Authenticode signer is missing on $($artifact.Name)"
            }
            if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne `
                $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected Authenticode signer on $($artifact.Name)"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows-x64
          path: dist-artifacts/*
          if-no-files-found: error

      - name: Remove Windows code-signing certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" `
              -Force -ErrorAction SilentlyContinue
            if ($env:WINDOWS_SIGNING_MODE -eq "self-signed") {
              Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:WINDOWS_CERTIFICATE_THUMBPRINT" `
                -Force -ErrorAction SilentlyContinue
            }
          }

  build-macos:
    if: needs.check-version.outputs.backend == 'legacy-tauri'
    name: Build (macOS ${{ matrix.label }})
    needs: [check-version, release-preflight]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple-Silicon
            rust_target: aarch64-apple-darwin
            asset_arch: aarch64
          - label: Intel
            rust_target: x86_64-apple-darwin
            asset_arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: release-macos-${{ matrix.asset_arch }}
          workspaces: . -> target
          cache-all-crates: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/legacy-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd apps/legacy-tauri/frontend && npm ci

      - name: Build ad-hoc signed Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: >-
            --target ${{ matrix.rust_target }}
            --config apps/legacy-tauri/native/tauri.macos.conf.json
            --config apps/legacy-tauri/native/tauri.macos.qa.conf.json

      - name: Normalize macOS artifact names
        env:
          APP_VERSION: ${{ needs.check-version.outputs.version }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          mkdir -p dist-artifacts
          BUNDLE_DIR="target/${RUST_TARGET}/release/bundle"

          APP_SRC=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          [ -n "$APP_SRC" ] || { echo '::error::macOS app bundle was not generated'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_SRC"
          SIGNING_INFO=$(codesign --display --verbose=4 "$APP_SRC" 2>&1)
          printf '%s\n' "$SIGNING_INFO" | grep -q 'Signature=adhoc'

          INFO_PLIST="$APP_SRC/Contents/Info.plist"
          [ -f "$INFO_PLIST" ] || { echo '::error::macOS Info.plist is missing'; exit 1; }
          EXECUTABLE_NAME=$(plutil -extract CFBundleExecutable raw -o - "$INFO_PLIST")
          [ -n "$EXECUTABLE_NAME" ] || { echo '::error::CFBundleExecutable is missing'; exit 1; }
          EXECUTABLE="$APP_SRC/Contents/MacOS/$EXECUTABLE_NAME"
          [ -x "$EXECUTABLE" ] || { echo '::error::macOS executable is missing'; exit 1; }
          if [ "$ASSET_ARCH" = "aarch64" ]; then
            EXPECTED_ARCH="arm64"
          else
            EXPECTED_ARCH="x86_64"
          fi
          lipo -archs "$EXECUTABLE" | tr ' ' '\n' | grep -qx "$EXPECTED_ARCH"

          DMG_SRC=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          [ -n "$DMG_SRC" ] || { echo '::error::DMG was not generated'; exit 1; }
          cp "$DMG_SRC" "dist-artifacts/Clippy_${APP_VERSION}_${ASSET_ARCH}.dmg"

          UPDATE_SRC=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
          [ -n "$UPDATE_SRC" ] || { echo '::error::macOS updater bundle was not generated'; exit 1; }
          cp "$UPDATE_SRC" "dist-artifacts/Clippy_${APP_VERSION}_${ASSET_ARCH}.app.tar.gz"
          [ -f "${UPDATE_SRC}.sig" ] || { echo '::error::macOS updater signature was not generated'; exit 1; }
          cp "${UPDATE_SRC}.sig" "dist-artifacts/Clippy_${APP_VERSION}_${ASSET_ARCH}.app.tar.gz.sig"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos-${{ matrix.asset_arch }}
          path: dist-artifacts/*
          if-no-files-found: error

  update-release:
    if: needs.check-version.outputs.backend == 'legacy-tauri'
    name: Update Release Notes
    needs: [check-version, release-preflight, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      artifact-metadata: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Download native release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Ensure unpublished draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release ${TAG} already exists and is public"
              exit 1
            fi
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "Clippy ${TAG}" --draft --notes "Building..."
          fi

      - name: Upload native artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release-assets/* \
            --repo "${{ github.repository }}" --clobber

      - name: Extract changelog and prepare release notes
        env:
          UI_FRAMEWORK: ${{ needs.check-version.outputs.framework }}
          UI_FRAMEWORK_VERSION: ${{ needs.check-version.outputs.framework_version }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="${{ needs.check-version.outputs.version }}"
          DL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          BUILDTIME="$(TZ=Asia/Shanghai date)"

          # Extract changelog section for current version
          awk "/^## ${TAG//./\\.}/{found=1; next} /^## v/{if(found) exit} found" CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "Release ${TAG}" > release_notes.txt
          fi

          CHANGELOG=$(cat release_notes.txt)
          cat > release_body.md <<ENDOFBODY
          UI: ${UI_FRAMEWORK} ${UI_FRAMEWORK_VERSION} (WebView). Slint is not included.

          ${CHANGELOG}

          ## 下载

          ### Linux（Ubuntu 22.04+ / 同等 glibc 发行版）
          #### DEB 包
          - Ubuntu 22.04+：[64位](${DL}/Clippy_${VER}_amd64_ubuntu22.deb)

          #### AppImage（支持自动更新）
          - Ubuntu 22.04+：[64位](${DL}/Clippy_${VER}_amd64_ubuntu22.AppImage)

          > Linux 正式包在 Ubuntu 22.04 基线上构建，并默认包含 GNOME Mutter/PipeWire 低延迟截图后端。

          > OCR 功能需要单独安装 tesseract：\`sudo apt install tesseract-ocr tesseract-ocr-chi-sim\`

          ### Windows 10/11（x64）
          - NSIS 安装程序（支持自动更新）：[下载](${DL}/Clippy_${VER}_x64-setup.exe)
          - MSI 安装程序：[下载](${DL}/Clippy_${VER}_x64.msi)
          ENDOFBODY

          if [ "${{ needs.release-preflight.outputs.windows_signing_mode }}" = "self-signed" ]; then
            cat >> release_body.md <<'ENDOFBODY'

          > Windows 安装包使用临时自签名证书完成 Authenticode 签名；签名可校验文件完整性，
          > 但不受公共 CA 信任，Windows SmartScreen 仍可能显示“未知发布者”警告。
          ENDOFBODY
          fi

          cat >> release_body.md <<ENDOFBODY

          ### macOS 11+（Ad-Hoc 签名）
          - Apple Silicon：[DMG](${DL}/Clippy_${VER}_aarch64.dmg)
          - Intel：[DMG](${DL}/Clippy_${VER}_x64.dmg)

          > macOS 应用使用 ad-hoc 签名，未经过 Apple Developer ID 公证；首次打开时可能需要在
          > “系统设置 → 隐私与安全性”中手动允许。
          ENDOFBODY

          cat >> release_body.md <<ENDOFBODY
          ---
          Built at ${BUILDTIME}
          ENDOFBODY

      - name: Generate and upload updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="${{ needs.check-version.outputs.version }}"
          DL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PLATFORMS="linux-x86_64,windows-x86_64,darwin-aarch64,darwin-x86_64"

          # 四个平台都先进入 workflow artifact，所有构建成功后才在这里创建 draft。
          # 生成器按受测契约读取四份签名，并拒绝缺签名、错误平台键、非 HTTPS URL
          # 或无效版本/时间。
          node scripts/generate-updater-manifest.mjs \
            --version "$VER" \
            --notes-file release_notes.txt \
            --pub-date "$PUB_DATE" \
            --base-url "$DL" \
            --signature-dir release-assets \
            --platforms "$PLATFORMS" \
            --output latest.json

          gh release upload "${TAG}" latest.json --repo "${{ github.repository }}" --clobber

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          LATEST=()
          if CURRENT=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null); then
            if node --input-type=module -e 'import {resolveReleaseBackend} from "./scripts/resolve-release-backend.mjs"; process.exit(resolveReleaseBackend(process.argv[1]).backend === "slint" ? 0 : 1)' "$CURRENT"; then
              LATEST=(--latest=false)
            fi
          fi
          gh release edit "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "Clippy ${TAG}" \
            --notes-file release_body.md \
            --draft=false "${LATEST[@]}"

  build-slint:
    if: needs.check-version.outputs.backend == 'slint'
    name: Slint Release Package (${{ matrix.platform }})
    needs: [check-version, release-preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    permissions:
      contents: read
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, platform: linux-x64, formats: "deb,appimage" }
          - { runner: windows-latest, platform: windows-x64, formats: "nsis,wix" }
          - { runner: macos-15, platform: macos-aarch64, formats: "app,dmg" }
          - { runner: macos-15-intel, platform: macos-x64, formats: "app,dmg" }
    env:
      SLINT_PLATFORM: ${{ matrix.platform }}
      SLINT_PACKAGE_FORMATS: ${{ matrix.formats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Jammy dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb1-dev libgbm-dev libegl1-mesa-dev libdrm-dev \
            libpipewire-0.3-dev patchelf squashfs-tools

      - name: Prepare libvpx source build on macOS
        if: runner.os == 'macOS'
        run: |
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
          if [ "$SLINT_PLATFORM" = macos-x64 ]; then brew install nasm; fi

      - name: Install Windows source-build shell dependencies
        if: runner.os == 'Windows'
        id: slint_msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          update: false
          install: make diffutils perl nasm

      - name: Expose Windows source-build shell tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo '${{ steps.slint_msys2.outputs.msys2-location }}\usr\bin' >> $env:GITHUB_PATH

      - name: Install Windows MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: slint-release-${{ matrix.platform }}
          workspaces: . -> target

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Verify codec pins and installer versions
        run: |
          node scripts/verify-recording-codec-supply-chain.mjs
          node --test scripts/slint-release.test.mjs

      - name: Build without WebView dependencies
        shell: bash
        run: |
          cargo tree --locked -p clippy-slint -e normal > slint-dependencies.txt
          if grep -E '(tauri[^ ]*|webkit2gtk|webview2-com|wry) v[0-9]' slint-dependencies.txt; then
            echo '::error::The Slint package must exclude WebView and Tauri'
            exit 1
          fi
          cargo build --locked --release -p clippy-slint --bin clippy-slint

      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - uses: ./.github/actions/slint-ocr-bundle

      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1 -OutputPath target/slint-windows-signing.json

      - name: Generate native packages
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              SIGNING=unsigned
              TMPDIR=$(mktemp -d)
              export TMPDIR
              trap 'rm -rf -- "$TMPDIR"' EXIT
              ;;
            macOS) SIGNING=ad-hoc ;;
            Windows) SIGNING="$WINDOWS_SIGNING_MODE" ;;
          esac
          echo "SLINT_RELEASE_SIGNING=$SIGNING" >> "$GITHUB_ENV"
          node scripts/slint-release.mjs prepare "$GITHUB_REF_NAME" "$SLINT_PLATFORM" "$GITHUB_SHA" "$SIGNING"
          cargo-packager --config target/packager/Packager.slint-release.toml --formats "$SLINT_PACKAGE_FORMATS"

      - name: Verify package identity and declared runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            OUT=target/packager/slint-release
            DEB=$(find "$OUT" -maxdepth 1 -name '*.deb' -print -quit)
            APPIMAGE=$(find "$OUT" -maxdepth 1 -name '*.AppImage' -print -quit)
            [ "$(dpkg-deb -f "$DEB" Package)" = clippy ]
            dpkg-deb -c "$DEB" | grep 'usr/bin/clippy-app$' >/dev/null
            dpkg-deb -c "$DEB" | grep 'BUILD-INFO.json$' >/dev/null
            VALID_OFFSET=""
            while IFS=: read -r offset _; do
              if unsquashfs -o "$offset" -s "$APPIMAGE" >/dev/null 2>&1; then
                VALID_OFFSET="$offset"
              fi
            done < <(LC_ALL=C grep -aob 'hsqs' "$APPIMAGE")
            [ -n "$VALID_OFFSET" ] || { echo '::error::Slint AppImage has no readable payload'; exit 1; }
            payload=$(mktemp -d)
            trap 'rm -rf -- "$payload"' EXIT
            dpkg-deb -x "$DEB" "$payload/deb"
            unsquashfs -o "$VALID_OFFSET" -d "$payload/appimage" "$APPIMAGE" usr/lib/clippy-app/ocr
            for format in deb appimage; do
              OCR="$payload/$format/usr/lib/clippy-app/ocr"
              python3 -B scripts/prepare-slint-ocr.py --bundle "$OCR"
              python3 -B scripts/prepare-slint-ocr.py --bundle "$OCR" --smoke
            done
            readelf -d target/release/clippy-slint | grep 'libpipewire-0.3.so.0' >/dev/null
            if readelf -d target/release/clippy-slint | grep -Eqi 'webkit|javascriptcore|libgtk'; then exit 1; fi
          else
            APP=target/packager/slint-release/Clippy.app
            codesign --verify --deep --strict "$APP"
            OCR="$APP/Contents/Resources/ocr"
            codesign --verify --strict "$OCR/clippy-ocr-worker"
            codesign --verify --strict "$OCR/libonnxruntime.dylib"
            python3 -B scripts/prepare-slint-ocr.py --bundle "$OCR" --smoke
            [ "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = com.clippy.desktop ]
            [ "$(plutil -extract LSMinimumSystemVersion raw -o - "$APP/Contents/Info.plist")" = "11.0" ]
            [ -n "$(plutil -extract NSScreenCaptureUsageDescription raw -o - "$APP/Contents/Info.plist")" ]
            otool -L "$APP/Contents/MacOS/clippy-app" > slint-macos-libraries.txt
            if grep -Fq 'ScreenCaptureKit.framework/' slint-macos-libraries.txt; then
              echo '::error::ScreenCaptureKit must load only when requested on supported macOS versions'
              exit 1
            fi
            otool -l "$APP/Contents/MacOS/clippy-app" | grep -A4 LC_BUILD_VERSION > slint-macos-target.txt
            awk '/minos/ { split($2, parts, "."); if (parts[1]>11 || (parts[1]==11 && parts[2]>0)) exit 1; found=1 } END { if (!found) exit 1 }' slint-macos-target.txt
          fi

      - name: Verify Windows package signatures and OCR payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/packager/slint-release -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          $installers |
            ForEach-Object {
              $signature = Get-AuthenticodeSignature $_.FullName
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
                throw "Invalid signature on $($_.Name)"
              }
            }
          $msi = @($installers | Where-Object Extension -eq '.msi')
          if ($msi.Count -ne 1) { throw 'Expected one Slint MSI package' }
          ./scripts/verify-slint-ocr-msi.ps1 -Package $msi[0].FullName -Application clippy-app.exe

      - name: Bind installers to the tag and SHA
        shell: bash
        run: |
          node scripts/slint-release.mjs collect "$GITHUB_REF_NAME" "$SLINT_PLATFORM" "$GITHUB_SHA" "$SLINT_RELEASE_SIGNING"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slint-release-${{ matrix.platform }}
          path: target/packager/slint-release-assets/*
          if-no-files-found: error

      - name: Remove Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            if ($env:WINDOWS_SIGNING_MODE -eq 'self-signed') {
              Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            }
          }

  update-slint-release:
    if: needs.check-version.outputs.backend == 'slint'
    name: Stage Slint Release Draft
    needs: [check-version, build-slint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      artifact-metadata: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: slint-release-*
          path: release-assets
          merge-multiple: true

      - name: Attach Slint installer evidence to a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UI_FRAMEWORK: ${{ needs.check-version.outputs.framework }}
          UI_FRAMEWORK_VERSION: ${{ needs.check-version.outputs.framework_version }}
        run: |
          {
            printf 'UI: %s %s (FemtoVG). Tauri is not included.\n\n' "$UI_FRAMEWORK" "$UI_FRAMEWORK_VERSION"
            awk -v heading="## $GITHUB_REF_NAME" '$0==heading {active=1; next} /^## v/ && active {exit} active' CHANGELOG.md
          } > release-notes.md
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > draft-state; then
            [ "$(cat draft-state)" = true ]
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Clippy $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
