name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Tag & Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches tauri.conf.json
        run: |
          CONF_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json ($CONF_VERSION)"
            exit 1
          fi

      - name: Verify tag is on main or dev branch
        run: |
          git fetch origin main dev --depth=1 || true
          TAG_SHA=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$TAG_SHA" origin/main 2>/dev/null || \
             git merge-base --is-ancestor "$TAG_SHA" origin/dev 2>/dev/null; then
            echo "Tag is on main or dev branch"
          else
            echo "::warning::Tag may not be on main/dev branch"
          fi

  build-linux:
    name: Build (${{ matrix.label }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: ubuntu22
          - runner: ubuntu-24.04
            label: ubuntu24
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libleptonica-dev libtesseract-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: release-${{ matrix.label }}
          workspaces: src-tauri -> target
          cache-all-crates: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: cd src && npm install

      - name: Patch deb depends for ubuntu-22
        if: matrix.label == 'ubuntu22'
        run: |
          jq '.bundle.linux.deb.depends = ["libtesseract4", "tesseract-ocr-eng", "tesseract-ocr-chi-sim", "liblept5"]' \
            src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clippy ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true

      - name: Rename artifacts with distro suffix
        run: |
          VER="${{ needs.check-version.outputs.version }}"
          LABEL="${{ matrix.label }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"

          DEB_SRC="${BUNDLE_DIR}/deb/Clippy_${VER}_amd64.deb"
          [ -f "$DEB_SRC" ] && cp "$DEB_SRC" "Clippy_${VER}_amd64_${LABEL}.deb"

          APPIMAGE_SRC=$(find "${BUNDLE_DIR}/appimage" -name "*.AppImage" 2>/dev/null | head -1)
          [ -n "$APPIMAGE_SRC" ] && cp "$APPIMAGE_SRC" "Clippy_${VER}_amd64_${LABEL}.AppImage"

          APPIMAGE_SIG=$(find "${BUNDLE_DIR}/appimage" -name "*.AppImage.sig" 2>/dev/null | head -1)
          [ -n "$APPIMAGE_SIG" ] && cp "$APPIMAGE_SIG" "Clippy_${VER}_amd64_${LABEL}.AppImage.sig"

      - name: Upload suffixed artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for f in Clippy_*_amd64_*.{deb,AppImage,AppImage.sig}; do
            [ -f "$f" ] || continue
            echo "Uploading $f ..."
            gh release upload "${TAG}" "$f" --repo "${{ github.repository }}" --clobber
          done

  update-release:
    name: Update Release Notes
    needs: [check-version, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="${{ needs.check-version.outputs.version }}"
          DL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          BUILDTIME="$(TZ=Asia/Shanghai date)"

          # Extract changelog section for current version
          awk "/^## ${TAG//./\\.}/{found=1; next} /^## v/{if(found) exit} found" CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "Release ${TAG}" > release_notes.txt
          fi

          CHANGELOG=$(cat release_notes.txt)

          cat > release_body.md <<ENDOFBODY
          ${CHANGELOG}

          ## 下载

          ### Linux
          #### DEB 包（根据系统版本选择）
          - Ubuntu 22.04：[64位](${DL}/Clippy_${VER}_amd64_ubuntu22.deb)
          - Ubuntu 24.04+：[64位](${DL}/Clippy_${VER}_amd64_ubuntu24.deb)

          #### AppImage（支持自动更新）
          - Ubuntu 22.04：[64位](${DL}/Clippy_${VER}_amd64_ubuntu22.AppImage)
          - Ubuntu 24.04+：[64位](${DL}/Clippy_${VER}_amd64_ubuntu24.AppImage)

          ---
          Built at ${BUILDTIME}
          ENDOFBODY

          gh release edit "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "Clippy ${TAG}" \
            --notes-file release_body.md \
            --draft=false
