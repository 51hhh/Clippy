name: Native QA Packages

on:
  workflow_dispatch:
    inputs:
      backend:
        description: '选择要打包的 UI 后端；默认只构建新版 Slint'
        required: true
        type: choice
        default: slint
        options:
          - slint
          - legacy
          - all

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
  artifact-metadata: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build-linux:
    if: inputs.backend == 'legacy' || inputs.backend == 'all'
    name: Legacy QA Bundle (Linux x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config squashfs-tools xdg-utils \
            libgbm-dev libegl-dev libdrm-dev libwayland-dev libxcb1-dev \
            libpipewire-0.3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: qa-linux-x64-recording
          workspaces: . -> target

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/legacy-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/legacy-tauri/frontend
        run: npm ci

      - name: Verify pinned recording codec supply chain
        run: node scripts/verify-recording-codec-supply-chain.mjs

      - name: Verify PipeWire fast-path baseline
        run: |
          TREE="$(cd apps/legacy-tauri/native && cargo tree --target x86_64-unknown-linux-gnu -e normal)"
          grep -q 'pipewire v' <<<"$TREE" || {
            echo '::error::Linux QA build must include pipewire-rs fast path'
            exit 1
          }
          grep -Eq 'libspa v.*\(.*vendor/libspa\)' <<<"$TREE" || {
            echo '::error::Linux QA build must use the Jammy-compatible vendored libspa patch'
            exit 1
          }

      - name: Build Linux QA bundles
        run: >-
          npx --prefix apps/legacy-tauri/frontend tauri build --ci --no-sign
          --features recording-wayland-qa,recording-linux-av-qa
          --config apps/legacy-tauri/native/tauri.linux.conf.json
          --config apps/legacy-tauri/native/tauri.ci.conf.json

      - name: Verify QA binary links PipeWire
        run: readelf -d target/release/clippy-app | grep -q 'libpipewire-0.3.so.0'

      - name: Finalize Linux QA AppImage
        run: ./scripts/finalize-appimage.sh

      - name: Prepare Linux QA artifact
        run: |
          mkdir -p qa-stage qa-artifacts
          cp target/release/bundle/deb/*.deb qa-stage/
          cp target/release/bundle/appimage/*.AppImage qa-stage/
          node scripts/qa-build-info.mjs \
            --backend legacy-tauri \
            --platform linux-x64 \
            --signing unsigned-qa-only \
            --sha "$GITHUB_SHA" \
            --output qa-stage/QA-BUILD.txt \
            --field recording_feature=recording-wayland-qa,recording-linux-av-qa
          (cd qa-stage && sha256sum ./*.deb ./*.AppImage > SHA256SUMS.txt)
          tar -czf "qa-artifacts/Clippy_Legacy_QA_${GITHUB_SHA}_linux-x64.tar.gz" -C qa-stage .

      - name: Generate version-bound QA record templates
        run: |
          mkdir -p qa-records
          VERSION=$(jq -r '.version' apps/legacy-tauri/native/tauri.conf.json)
          for PROFILE in \
            linux-gnome-x11 linux-gnome-wayland linux-gnome-wayland-ubuntu24 \
            linux-gnome-wayland-ubuntu26 \
            linux-kde-wayland linux-wlroots-wayland windows-10-x64 windows-11-x64 \
            macos-intel macos-apple-silicon; do
            node scripts/manual-qa.mjs template \
              --profile "$PROFILE" --sha "$GITHUB_SHA" --version "$VERSION" \
              --output "qa-records/${PROFILE}.json"
          done
          cp docs/native-qa.md qa-records/README.md

      - name: Upload Linux QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-legacy-linux-x64-${{ github.sha }}
          path: qa-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload QA record templates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-legacy-record-templates-${{ github.sha }}
          path: qa-records
          if-no-files-found: error
          retention-days: 14

  smoke-ubuntu24:
    if: inputs.backend == 'legacy' || inputs.backend == 'all'
    name: Legacy Runtime Smoke (Ubuntu 24.04 x64)
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install runtime smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 \
            libgbm1 libegl1 libdrm2 libwayland-egl1 libpipewire-0.3-0 \
            xvfb xauth x11-utils ffmpeg dbus-daemon squashfs-tools

      - name: Verify PipeWire runtime dependency
        run: ldconfig -p | grep -q 'libpipewire-0.3.so.0'

      - name: Download Ubuntu 22 QA bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qa-legacy-linux-x64-${{ github.sha }}
          path: qa-download

      - name: Verify and extract Ubuntu 22 QA bundle
        run: |
          mkdir -p qa-runtime target
          tar -xzf "qa-download/Clippy_Legacy_QA_${GITHUB_SHA}_linux-x64.tar.gz" -C qa-runtime
          (cd qa-runtime && sha256sum -c SHA256SUMS.txt)

      - name: Run packaged AppImage on Ubuntu 24
        env:
          CLIPPY_APPIMAGE_SMOKE_REQUIRED: "1"
        run: |
          APPIMAGE=$(find qa-runtime -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          [ -n "$APPIMAGE" ] || { echo '::error::QA AppImage is missing'; exit 1; }
          ./scripts/smoke-appimage-x11.sh "$APPIMAGE"

      - name: Upload Ubuntu 24 smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-legacy-ubuntu24-x11-smoke-${{ github.sha }}
          path: |
            target/appimage-x11-smoke.*/runner.log
            target/appimage-x11-smoke.*/first-instance.log
            target/appimage-x11-smoke.*/single-instance-call.log
            target/appimage-x11-smoke.*/window-info.txt
            target/appimage-x11-smoke.*/window-xprop.txt
            target/appimage-x11-smoke.*/main-window.png
            target/appimage-x11-smoke.*/signalstats.txt
            target/appimage-x11-smoke.*/ffmpeg.log
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    if: inputs.backend == 'legacy' || inputs.backend == 'all'
    name: Legacy QA Bundle (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: qa-windows-x64-recording-source
          workspaces: . -> target

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/legacy-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/legacy-tauri/frontend
        run: npm ci

      - name: Install Windows recording source-build shell dependencies
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          update: false
          install: make diffutils perl nasm

      - name: Expose Windows recording source-build shell tools
        shell: pwsh
        run: echo '${{ steps.msys2.outputs.msys2-location }}\usr\bin' >> $env:GITHUB_PATH

      - name: Install Windows MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Verify pinned recording codec supply chain
        run: node scripts/verify-recording-codec-supply-chain.mjs

      - name: Prepare Windows QA app-local runtime
        id: runtime
        shell: pwsh
        run: ./scripts/prepare-windows-qa-runtime.ps1

      - name: Prepare self-signed Windows code-signing certificate
        shell: pwsh
        run: ./scripts/prepare-windows-signing.ps1

      - name: Build Windows QA bundles
        run: >-
          npx --prefix apps/legacy-tauri/frontend tauri build --ci
          --features recording-windows-av-qa
          --target x86_64-pc-windows-msvc
          --config apps/legacy-tauri/native/tauri.windows.conf.json
          --config apps/legacy-tauri/native/tauri.ci.conf.json
          --config apps/legacy-tauri/native/tauri.windows.signing.conf.json
          --config "${{ steps.runtime.outputs.runtime_config }}"

      - name: Verify Windows QA app-local runtime payload
        shell: pwsh
        run: >-
          node scripts/verify-windows-qa-runtime.mjs
          --manifest "${{ steps.runtime.outputs.runtime_manifest }}"
          --config "${{ steps.runtime.outputs.runtime_config }}"
          --manifest-sha256 "${{ steps.runtime.outputs.runtime_manifest_sha256 }}"
          --expected-source "${{ github.sha }}"
          --executable target/x86_64-pc-windows-msvc/release/clippy-app.exe
          --payload-root target/x86_64-pc-windows-msvc/release

      - name: Prepare Windows QA artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path qa-artifacts | Out-Null
          $nsis = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis -File -Filter "*-setup.exe"
          $msi = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/msi -File -Filter "*.msi"
          if (-not $nsis -or -not $msi) { throw "Windows QA installers are incomplete" }
          foreach ($artifact in @($nsis, $msi)) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status.ToString() -ne "Valid") {
              throw "Invalid Authenticode signature on $($artifact.Name): $($signature.Status)"
            }
            if (-not $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne
                $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected Authenticode signer on $($artifact.Name)"
            }
          }
          Copy-Item $nsis.FullName qa-artifacts/
          Copy-Item $msi.FullName qa-artifacts/
          Copy-Item -LiteralPath '${{ steps.runtime.outputs.runtime_manifest }}' -Destination qa-artifacts/QA-WINDOWS-RUNTIME.json
          node scripts/qa-build-info.mjs `
            --backend legacy-tauri `
            --platform windows-x64 `
            --signing self-signed-qa-only `
            --sha $env:GITHUB_SHA `
            --output qa-artifacts/QA-BUILD.txt `
            --field recording_feature=recording-windows-av-qa `
            --field target=x86_64-pc-windows-msvc `
            --field runtime_provenance_sha256=${{ steps.runtime.outputs.runtime_manifest_sha256 }}
          Get-ChildItem qa-artifacts -File | Where-Object Name -ne "SHA256SUMS.txt" |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content qa-artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-legacy-windows-x64-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove Windows code-signing certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" `
              -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$env:WINDOWS_CERTIFICATE_THUMBPRINT" `
              -Force -ErrorAction SilentlyContinue
          }

  build-macos:
    if: inputs.backend == 'legacy' || inputs.backend == 'all'
    name: Legacy QA Bundle (macOS ${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple-Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            asset_arch: aarch64
            recording_feature: recording-macos-av-qa
          - label: Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            asset_arch: x64
            recording_feature: recording-macos-av-qa,recording-vp9-source-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_target }}
          components: llvm-tools-preview

      - name: Install macOS Intel recording source-build dependencies
        if: matrix.asset_arch == 'x64'
        run: brew install nasm

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: qa-macos-${{ matrix.asset_arch }}
          workspaces: . -> target

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/legacy-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/legacy-tauri/frontend
        run: npm ci

      - name: Verify pinned recording codec supply chain
        run: node scripts/verify-recording-codec-supply-chain.mjs

      - name: Build ad-hoc signed macOS QA bundle
        run: >-
          npx --prefix apps/legacy-tauri/frontend tauri build --ci --target ${{ matrix.rust_target }}
          --features ${{ matrix.recording_feature }}
          --config apps/legacy-tauri/native/tauri.macos.conf.json
          --config apps/legacy-tauri/native/tauri.macos.recording.conf.json
          --config apps/legacy-tauri/native/tauri.ci.conf.json
          --config apps/legacy-tauri/native/tauri.macos.qa.conf.json

      - name: Verify and prepare macOS QA artifact
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          mkdir -p qa-artifacts
          BUNDLE_DIR="target/${RUST_TARGET}/release/bundle"
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo '::error::macOS app bundle was not generated'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'

          INFO_PLIST="$APP/Contents/Info.plist"
          [ -f "$INFO_PLIST" ] || { echo '::error::macOS Info.plist is missing'; exit 1; }
          EXECUTABLE_NAME=$(plutil -extract CFBundleExecutable raw -o - "$INFO_PLIST")
          [ -n "$EXECUTABLE_NAME" ] || { echo '::error::CFBundleExecutable is missing'; exit 1; }
          EXECUTABLE="$APP/Contents/MacOS/$EXECUTABLE_NAME"
          [ -x "$EXECUTABLE" ] || { echo '::error::macOS executable is missing'; exit 1; }
          [ "$(plutil -extract LSMinimumSystemVersion raw -o - "$INFO_PLIST")" = "12.3" ] || {
            echo '::error::macOS recording QA bundle must require macOS 12.3'; exit 1;
          }
          [ -n "$(plutil -extract NSScreenCaptureUsageDescription raw -o - "$INFO_PLIST")" ] || {
            echo '::error::macOS recording QA bundle is missing NSScreenCaptureUsageDescription'; exit 1;
          }
          [ -n "$(plutil -extract NSMicrophoneUsageDescription raw -o - "$INFO_PLIST")" ] || {
            echo '::error::macOS recording QA bundle is missing NSMicrophoneUsageDescription'; exit 1;
          }
          if [ "$ASSET_ARCH" = "aarch64" ]; then
            EXPECTED_ARCH="arm64"
          else
            EXPECTED_ARCH="x86_64"
          fi
          lipo -archs "$EXECUTABLE" | tr ' ' '\n' | grep -qx "$EXPECTED_ARCH"

          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          [ -n "$DMG" ] || { echo '::error::macOS DMG was not generated'; exit 1; }
          cp "$DMG" qa-artifacts/
          node scripts/qa-build-info.mjs \
            --backend legacy-tauri \
            --platform "macos-$ASSET_ARCH" \
            --signing ad-hoc-qa-only \
            --sha "$GITHUB_SHA" \
            --output qa-artifacts/QA-BUILD.txt \
            --field recording_feature=${{ matrix.recording_feature }} \
            --field minimum_system_version=12.3
          (cd qa-artifacts && shasum -a 256 ./*.dmg > SHA256SUMS.txt)

      - name: Upload macOS QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-legacy-macos-${{ matrix.asset_arch }}-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-slint-linux:
    if: inputs.backend == 'slint' || inputs.backend == 'all'
    name: Slint QA Bundle (Linux x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Slint packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file libfontconfig1-dev libfreetype6-dev \
            pkg-config patchelf squashfs-tools libclang-dev libpipewire-0.3-dev libxkbcommon-x11-0 \
            libwayland-dev libgbm-dev libegl1-mesa-dev libdrm-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: qa-slint-linux-x64
          workspaces: . -> target

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Test Slint QA host
        run: >-
          cargo test --locked -p clippy-platform -p clippy-slint
          --features qa-build

      - name: Build Slint QA binary
        run: >-
          cargo build --locked --release -p clippy-slint
          --bin clippy-slint-qa --features qa-build

      - uses: ./.github/actions/slint-ocr-bundle

      - name: Build Slint Linux QA bundles
        run: |
          rm -rf target/packager/slint-qa
          TMPDIR=$(mktemp -d)
          export TMPDIR
          trap 'rm -rf -- "$TMPDIR"' EXIT
          cargo-packager \
            --config apps/slint/Packager.qa.toml \
            --formats deb,appimage

      - name: Verify Slint Linux QA bundles
        run: |
          OUT=target/packager/slint-qa
          DEB=$(find "$OUT" -maxdepth 1 -type f -name 'clippy-slint-qa_*_amd64.deb' -print -quit)
          APPIMAGE=$(find "$OUT" -maxdepth 1 -type f -name 'clippy-slint-qa_*_x86_64.AppImage' -print -quit)
          [ -n "$DEB" ] || { echo '::error::Slint QA deb is missing'; exit 1; }
          [ -n "$APPIMAGE" ] || { echo '::error::Slint QA AppImage is missing'; exit 1; }
          [ "$(dpkg-deb -f "$DEB" Package)" = "clippy-slint-qa" ]
          [ "$(dpkg-deb -f "$DEB" Version)" = "0.2.0" ]
          [ "$(dpkg-deb -f "$DEB" Depends)" = "libc6, libfontconfig1, libgcc-s1, libstdc++6, libpipewire-0.3-0 | libpipewire-0.3-0t64, libgbm1, libegl1, libxkbcommon-x11-0" ]
          [ "$(dpkg-deb -f "$DEB" Maintainer)" = "zhongweixi2000" ]
          dpkg-deb -c "$DEB" | grep 'usr/bin/clippy-slint-qa$' >/dev/null
          dpkg-deb -c "$DEB" | grep 'LicenseRef-Slint-Royalty-free-2.0.md$' >/dev/null
          LINKS=$(ldd target/release/clippy-slint-qa)
          if grep -Eqi '(webkit|javascriptcore|gtk-3)' <<<"$LINKS"; then
            echo '::error::Slint QA binary unexpectedly links a WebView or GTK runtime'
            exit 1
          fi

          VALID_OFFSET=""
          while IFS=: read -r offset _; do
            if unsquashfs -o "$offset" -s "$APPIMAGE" >/dev/null 2>&1; then
              VALID_OFFSET="$offset"
            fi
          done < <(LC_ALL=C grep -aob 'hsqs' "$APPIMAGE")
          [ -n "$VALID_OFFSET" ] || { echo '::error::Slint QA AppImage has no readable payload'; exit 1; }
          unsquashfs -o "$VALID_OFFSET" -lls "$APPIMAGE" | grep 'usr/bin/clippy-slint-qa$' >/dev/null
          unsquashfs -o "$VALID_OFFSET" -lls "$APPIMAGE" | grep 'LicenseRef-Slint-Royalty-free-2.0.md$' >/dev/null
          unsquashfs -o "$VALID_OFFSET" -lls "$APPIMAGE" | grep 'libxkbcommon-x11\.so\.0$' >/dev/null
          payload=$(mktemp -d)
          trap 'rm -rf -- "$payload"' EXIT
          dpkg-deb -x "$DEB" "$payload/deb"
          unsquashfs -o "$VALID_OFFSET" -d "$payload/appimage" "$APPIMAGE" usr/lib/clippy-slint-qa/ocr
          for format in deb appimage; do
            OCR="$payload/$format/usr/lib/clippy-slint-qa/ocr"
            python3 -B scripts/prepare-slint-ocr.py --bundle "$OCR"
            python3 -B scripts/prepare-slint-ocr.py --bundle "$OCR" --smoke
          done

      - name: Prepare Slint Linux QA artifact
        run: |
          mkdir -p qa-slint-stage qa-slint-artifacts
          cp target/packager/slint-qa/*.deb qa-slint-stage/
          cp target/packager/slint-qa/*.AppImage qa-slint-stage/
          cp target/packager/slint-ocr/OCR-BUNDLE.json qa-slint-stage/
          node scripts/qa-build-info.mjs \
            --backend slint \
            --platform linux-x64 \
            --signing unsigned-qa-only \
            --sha "$GITHUB_SHA" \
            --output qa-slint-stage/QA-BUILD.txt \
            --field packager=cargo-packager-0.11.8
          (cd qa-slint-stage && sha256sum ./*.deb ./*.AppImage OCR-BUNDLE.json > SHA256SUMS.txt)
          tar -czf "qa-slint-artifacts/Clippy_Slint_QA_${GITHUB_SHA}_linux-x64.tar.gz" \
            -C qa-slint-stage .

      - name: Upload Slint Linux QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-slint-linux-x64-${{ github.sha }}
          path: qa-slint-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-slint-windows:
    if: inputs.backend == 'slint' || inputs.backend == 'all'
    name: Slint QA Bundle (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Windows source-build shell dependencies
        id: slint_msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MSYS
          update: false
          install: make diffutils perl nasm

      - name: Expose Windows source-build shell tools
        shell: pwsh
        run: echo '${{ steps.slint_msys2.outputs.msys2-location }}\usr\bin' >> $env:GITHUB_PATH

      - name: Install Windows MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Windows QA 恢复约 1.19 GB 的 target 缓存时同样长时间停滞。
          prefix-key: v2-slint-rust
          cache-targets: false
          key: qa-slint-windows-x64
          workspaces: . -> target

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Test Slint QA host
        run: >-
          cargo test --locked -p clippy-platform -p clippy-slint
          --features qa-build

      - name: Build Slint QA binary
        run: >-
          cargo build --locked --release -p clippy-slint
          --bin clippy-slint-qa --features qa-build

      - uses: ./.github/actions/slint-ocr-bundle

      - name: Build Slint Windows QA bundles
        shell: pwsh
        run: |
          Remove-Item target/packager/slint-qa -Recurse -Force -ErrorAction SilentlyContinue
          cargo-packager `
            --config apps/slint/Packager.qa.toml `
            --formats nsis,wix
          if ($LASTEXITCODE -ne 0) { throw "cargo-packager exited with $LASTEXITCODE" }

      - name: Verify and prepare Slint Windows QA artifact
        shell: pwsh
        run: |
          $out = 'target/packager/slint-qa'
          $nsis = @(Get-ChildItem $out -File -Filter '*.exe')
          $msi = @(Get-ChildItem $out -File -Filter '*.msi')
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected one NSIS and one MSI package, got $($nsis.Count) and $($msi.Count)"
          }
          if (-not (Test-Path target/release/clippy-slint-qa.exe -PathType Leaf)) {
            throw 'Slint QA executable is missing'
          }
          ./scripts/verify-slint-ocr-msi.ps1 -Package $msi[0].FullName -Application clippy-slint-qa.exe

          New-Item -ItemType Directory -Force -Path qa-slint-artifacts | Out-Null
          Copy-Item $nsis[0].FullName qa-slint-artifacts/
          Copy-Item $msi[0].FullName qa-slint-artifacts/
          Copy-Item target/packager/slint-ocr/OCR-BUNDLE.json qa-slint-artifacts/
          node scripts/qa-build-info.mjs `
            --backend slint `
            --platform windows-x64 `
            --signing unsigned-qa-only `
            --sha $env:GITHUB_SHA `
            --output qa-slint-artifacts/QA-BUILD.txt `
            --field packager=cargo-packager-0.11.8 `
            --field target=x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "QA metadata exited with $LASTEXITCODE" }
          Get-ChildItem qa-slint-artifacts -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content qa-slint-artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload Slint Windows QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-slint-windows-x64-${{ github.sha }}
          path: qa-slint-artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-slint-macos:
    if: inputs.backend == 'slint' || inputs.backend == 'all'
    name: Slint QA Bundle (macOS ${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple-Silicon
            runner: macos-15
            asset_arch: aarch64
            expected_arch: arm64
          - label: Intel
            runner: macos-15-intel
            asset_arch: x64
            expected_arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare macOS deployment target
        run: echo 'MACOSX_DEPLOYMENT_TARGET=12.3' >> "$GITHUB_ENV"

      - name: Install macOS Intel source-build dependencies
        if: matrix.asset_arch == 'x64'
        run: brew install nasm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: qa-slint-macos-${{ matrix.asset_arch }}
          workspaces: . -> target

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Test Slint QA host
        run: >-
          cargo test --locked -p clippy-platform -p clippy-slint
          --features qa-build

      - name: Build Slint QA binary
        run: >-
          cargo build --locked --release -p clippy-slint
          --bin clippy-slint-qa --features qa-build

      - uses: ./.github/actions/slint-ocr-bundle
        with:
          macos-worker-target: '12.3'

      - name: Build Slint macOS QA bundles
        run: |
          rm -rf target/packager/slint-qa
          bash scripts/package-slint-macos.sh apps/slint/Packager.qa.toml \
            'target/packager/slint-qa/Clippy Slint QA.app'

      - name: Verify and prepare Slint macOS QA artifact
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          OUT=target/packager/slint-qa
          APP=$(find "$OUT" -maxdepth 1 -type d -name '*.app' -print -quit)
          DMG=$(find "$OUT" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          [ -n "$APP" ] || { echo '::error::Slint QA app bundle is missing'; exit 1; }
          [ -n "$DMG" ] || { echo '::error::Slint QA DMG is missing'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -q 'Signature=adhoc'

          INFO_PLIST="$APP/Contents/Info.plist"
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$INFO_PLIST")" = "com.clippy.qa.slint" ]
          [ "$(plutil -extract LSMinimumSystemVersion raw -o - "$INFO_PLIST")" = "12.3" ]
          [ -n "$(plutil -extract NSScreenCaptureUsageDescription raw -o - "$INFO_PLIST")" ]
          [ -n "$(plutil -extract NSMicrophoneUsageDescription raw -o - "$INFO_PLIST")" ]
          codesign --display --entitlements - "$APP" > slint-macos-entitlements.plist
          [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' slint-macos-entitlements.plist)" = true ]
          EXECUTABLE_NAME=$(plutil -extract CFBundleExecutable raw -o - "$INFO_PLIST")
          [ "$EXECUTABLE_NAME" = "clippy-slint-qa" ]
          EXECUTABLE="$APP/Contents/MacOS/$EXECUTABLE_NAME"
          [ -x "$EXECUTABLE" ]
          lipo -archs "$EXECUTABLE" | tr ' ' '\n' | grep -qx "$EXPECTED_ARCH"
          nm -u "$EXECUTABLE" > slint-macos-imports.txt
          if grep -q '_AVCaptureDeviceTypeMicrophone$' slint-macos-imports.txt; then
            echo '::error::The microphone device type must be resolved at runtime'
            exit 1
          fi
          OCR="$APP/Contents/Resources/ocr"
          codesign --verify --strict "$OCR/clippy-ocr-worker"
          codesign --verify --strict "$OCR/libonnxruntime.dylib"
          python3 -B scripts/prepare-slint-ocr.py --bundle "$OCR" --smoke

          mkdir -p qa-slint-artifacts
          cp "$DMG" qa-slint-artifacts/
          cp "$OCR/OCR-BUNDLE.json" qa-slint-artifacts/
          node scripts/qa-build-info.mjs \
            --backend slint \
            --platform "macos-$ASSET_ARCH" \
            --signing ad-hoc-qa-only \
            --sha "$GITHUB_SHA" \
            --output qa-slint-artifacts/QA-BUILD.txt \
            --field packager=cargo-packager-0.11.8 \
            --field minimum_system_version=12.3
          (cd qa-slint-artifacts && shasum -a 256 ./*.dmg OCR-BUNDLE.json > SHA256SUMS.txt)

      - name: Upload Slint macOS QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qa-slint-macos-${{ matrix.asset_arch }}-${{ github.sha }}
          path: qa-slint-artifacts
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
