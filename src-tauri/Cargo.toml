[package]
name = "clippy-app"
version = "0.1.16"
description = "跨平台轻量剪贴板管理器"
authors = ["zhongweixi2000"]
edition = "2021"

[lib]
name = "clippy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
resvg = "0.43"
tiny-skia = "0.11"
usvg = "0.43"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-autostart = "2"
ureq = "3"
regex-lite = "0.1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
urlencoding = "2"
url = "2"
xcap = "0.9"
keyring = "4.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
webkit2gtk = "2.0"
inotify = "0.11"
ashpd = { version = "0.13", features = ["screenshot", "documents", "remote_desktop", "screencast"] }
libwayshot-xcap = "0.3"
x11rb = "0.13"
nix = { version = "0.30", features = ["poll"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
