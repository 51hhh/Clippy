[package]
name = "clippy-app"
version = "0.1.16"
description = "跨平台轻量剪贴板管理器"
authors = ["zhongweixi2000"]
edition = "2021"

[lib]
name = "clippy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
resvg = "0.43"
tiny-skia = "0.11"
usvg = "0.43"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# 另存为/选择目录对话框：由 Tauri 官方插件封装 rfd，Linux 下的 GTK/Portal 差异由插件负责。
tauri-plugin-dialog = "2"
# 只用于把保存时间格式化进文件名模板（本地时区）。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-autostart = "2"
ureq = "3"
regex-lite = "0.1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
urlencoding = "2"
url = "2"
xcap = "0.9"
keyring = "4.1"
# 有道 web 端点的签名用 MD5、响应用 AES-128-CBC 加密，只服务于翻译的非官方回退路径。
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
webkit2gtk = "2.0"
inotify = "0.11"
ashpd = { version = "0.13", features = ["screenshot", "documents", "remote_desktop", "screencast"] }
libwayshot-xcap = "0.3"
x11rb = "0.13"
nix = { version = "0.30", features = ["poll"] }

[dev-dependencies]
tempfile = "3"
# 性能回归基线，只被 benches/ 使用；harness = false 让 criterion 自己管命令行。
criterion = "0.8"

[[bench]]
name = "screenshot_bench"
harness = false

[[bench]]
name = "clipboard_bench"
harness = false

[[bench]]
name = "storage_bench"
harness = false

# 基准需要优化后的代码，但不需要 release 那套为发布体积服务的 lto = "fat" +
# 单 codegen-unit（会让每次 cargo bench 的编译时间高到没人愿意跑）。
# 因此基准数字用于版本间相对对比，不代表发布二进制的绝对性能。
[profile.bench]
lto = false
codegen-units = 16

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
