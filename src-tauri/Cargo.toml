[package]
name = "clippy-app"
version = "0.1.17"
description = "跨平台轻量剪贴板管理器"
authors = ["zhongweixi2000"]
edition = "2021"

[lib]
name = "clippy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
resvg = "0.43"
tiny-skia = "0.11"
usvg = "0.43"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# 另存为/选择目录对话框：由 Tauri 官方插件封装 rfd，Linux 下的 GTK/Portal 差异由插件负责。
tauri-plugin-dialog = "2"
# 只用于把保存时间格式化进文件名模板（本地时区）。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
# 直接用 png crate 只为一件事：往 PNG 里写/读 iTXt 元数据块（贴图工程数据，
# 见 pin/project.rs）。image crate 不暴露 chunk API。版本跟随 image 已经锁定的这一个，
# 不引入新的下载。
png = "0.17"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-autostart = "2"
ureq = "3"
regex-lite = "0.1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
urlencoding = "2"
url = "2"
xcap = "0.9"
keyring = "4.1"
# 有道 web 端点的签名用 MD5、响应用 AES-128-CBC 加密，只服务于翻译的非官方回退路径。
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
webkit2gtk = "2.0"
# 截图覆盖层必须绕过 Tauri 的窗口定位：Wayland 不允许客户端自己摆窗口，
# set_position/set_size 会被合成器忽略。参考 flashot（MIT）改为直接配置底层 GTK 窗口
# （`fullscreen_on_monitor`）并用 GDK 的显示器几何选屏。版本跟随 Tauri v2 已锁定的 0.18。
gtk = { version = "0.18", features = ["v3_24"] }
gdk = { version = "0.18", features = ["v3_24"] }
inotify = "0.11"
ashpd = { version = "0.13", features = ["screenshot", "documents", "remote_desktop", "screencast"] }
libwayshot-xcap = "0.3"
# Mutter 的 org.gnome.Mutter.ScreenCast 把画面走 PipeWire 送出来（不编 PNG，快一个数量级，
# 见 docs/capture-linux.md §3.4）。版本已经被 xcap 锁在 lockfile 里，不引入新的下载。
pipewire = "0.9"
# 只为在 zbus 的信号流上调一次 `.next()`（等 PipeWireStreamAdded）。zbus 自己就依赖它。
futures-util = { version = "0.3", default-features = false }
x11rb = "0.13"
nix = { version = "0.30", features = ["poll"] }

[dev-dependencies]
tempfile = "3"
# 性能回归基线，只被 benches/ 使用；harness = false 让 criterion 自己管命令行。
criterion = "0.8"

[[bench]]
name = "screenshot_bench"
harness = false

[[bench]]
name = "clipboard_bench"
harness = false

[[bench]]
name = "storage_bench"
harness = false

# 基准需要优化后的代码，但不需要 release 那套为发布体积服务的 lto = "fat" +
# 单 codegen-unit（会让每次 cargo bench 的编译时间高到没人愿意跑）。
# 因此基准数字用于版本间相对对比，不代表发布二进制的绝对性能。
[profile.bench]
lto = false
codegen-units = 16

# dev 也要能测出真实的快慢。这个项目里绝大多数问题都是"慢"或"糊"，而它们全都是在
# `cargo tauri dev` 里被观察到的——opt-level = 0 下贴图清晰度补偿要 1.23 s
# （release 0.25 s），于是"糊一下才变清"这种纯属 debug 构建的现象会被当成 bug 报上来，
# 反过来真正的性能回归又淹在噪声里。opt-level = 1 把这条路拉回 0.20 s，
# 代价只是增量编译 26 s → 29 s；`debug = true` 没动，panic 行号与回溯照旧。
[profile.dev]
opt-level = 1

# 上面那档对纯计算够用了，但 PNG 编解码不到 opt-level = 3 就慢十几倍：
# 截图链路的墙钟时间几乎全在它上面（release 下 1080p 约 77 ms，见 docs/bench-baseline.md），
# dev 下 2560x1600 的冻结帧要编码一两秒，覆盖层首帧就得等这么久。
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
