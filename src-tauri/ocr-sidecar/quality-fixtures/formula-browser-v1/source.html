<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clippy formula quality corpus</title>
  <style>
    @font-face {
      font-family: "Clippy Fixture";
      src: url("/text-font.otf") format("opentype");
      font-display: block;
    }
    @font-face {
      font-family: "Clippy Math";
      src: url("/math-font.ttf") format("truetype");
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #111827;
      background: #fff;
      font-family: "Clippy Fixture", sans-serif;
    }
    #ready { position: fixed; inset: 0 auto auto 0; width: 4px; height: 4px; background: rgb(0 200 0); }
    .scene { display: none; padding: 28px 36px; }
    .scene[data-active="true"] { display: block; }
    math {
      font-family: "Clippy Math";
      font-size: 54px;
      line-height: 1.35;
      white-space: nowrap;
    }
    .tall math { font-size: 45px; }
  </style>
</head>
<body>
  <div id="ready"></div>

  <section class="scene" data-scene="fraction-radical"
    data-text="x² + 1/2 = √2" data-latex="x^{2} + \frac{1}{2} = \sqrt{2}"
    data-tags="fraction,radical,superscript">
    <math display="block"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><msqrt><mn>2</mn></msqrt></math>
  </section>

  <section class="scene" data-scene="integral-limit"
    data-text="∫₀∞ e⁻ˣ² dx = √π/2" data-latex="\int_{0}^{\infty} e^{-x^{2}}\,dx = \frac{\sqrt{\pi}}{2}"
    data-tags="integral,limits,fraction,greek">
    <math display="block"><munderover><mo>∫</mo><mn>0</mn><mo>∞</mo></munderover><msup><mi>e</mi><mrow><mo>−</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></msup><mi>d</mi><mi>x</mi><mo>=</mo><mfrac><msqrt><mi>π</mi></msqrt><mn>2</mn></mfrac></math>
  </section>

  <section class="scene" data-scene="summation"
    data-text="Σₖ₌₁ⁿ k = n(n+1)/2" data-latex="\sum_{k=1}^{n} k = \frac{n(n+1)}{2}"
    data-tags="summation,limits,fraction">
    <math display="block"><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>k</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mo>(</mo><mi>n</mi><mo>+</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></math>
  </section>

  <section class="scene tall" data-scene="matrix"
    data-text="A = [a b; c d]" data-latex="A = \begin{bmatrix} a &amp; b \\ c &amp; d \end{bmatrix}"
    data-tags="matrix,rows,columns">
    <math display="block"><mi>A</mi><mo>=</mo><mrow><mo>[</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo>]</mo></mrow></math>
  </section>

  <section class="scene tall" data-scene="piecewise"
    data-text="f(x) = { x², x≥0; −x, x&lt;0" data-latex="f(x) = \begin{cases} x^{2}, &amp; x \geq 0 \\ -x, &amp; x &lt; 0 \end{cases}"
    data-tags="piecewise,rows,relations">
    <math display="block"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mrow><mo>{</mo><mtable><mtr><mtd><msup><mi>x</mi><mn>2</mn></msup><mo>,</mo></mtd><mtd><mi>x</mi><mo>≥</mo><mn>0</mn></mtd></mtr><mtr><mtd><mo>−</mo><mi>x</mi><mo>,</mo></mtd><mtd><mi>x</mi><mo>&lt;</mo><mn>0</mn></mtd></mtr></mtable></mrow></math>
  </section>

  <section class="scene" data-scene="greek-subscript"
    data-text="αₜ = β₀ + γ₁ Δxₜ" data-latex="\alpha_{t} = \beta_{0} + \gamma_{1}\Delta x_{t}"
    data-tags="greek,subscript,symbols">
    <math display="block"><msub><mi>α</mi><mi>t</mi></msub><mo>=</mo><msub><mi>β</mi><mn>0</mn></msub><mo>+</mo><msub><mi>γ</mi><mn>1</mn></msub><mi>Δ</mi><msub><mi>x</mi><mi>t</mi></msub></math>
  </section>

  <script>
    const sceneId = new URLSearchParams(location.search).get("scene");
    const scene = document.querySelector(`[data-scene="${CSS.escape(sceneId || "")}"]`);
    if (!scene) throw new Error("unknown scene");
    scene.dataset.active = "true";

    const roundedQuad = rect => [
      [Math.round(rect.left), Math.round(rect.top)],
      [Math.round(rect.right), Math.round(rect.top)],
      [Math.round(rect.right), Math.round(rect.bottom)],
      [Math.round(rect.left), Math.round(rect.bottom)],
    ];

    document.fonts.ready.then(async () => {
      const math = scene.querySelector("math");
      const payload = {
        scene: sceneId,
        viewport: { width: innerWidth, height: innerHeight, devicePixelRatio },
        fontReady: document.fonts.check('32px "Clippy Fixture"')
          && document.fonts.check('32px "Clippy Math"'),
        tags: scene.dataset.tags.split(","),
        line: {
          id: `${sceneId}-formula`,
          kind: "formula",
          text: scene.dataset.text,
          formula: { format: "latex", value: scene.dataset.latex },
          quad: roundedQuad(math.getBoundingClientRect()),
        },
      };
      await fetch("/contract", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
    });
  </script>
</body>
</html>
