<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clippy · Update review</title></head>
<body>
  <main class="dev-review">
    <header class="review-header"><div><strong>Clippy</strong><span id="review-heading"></span></div>
      <nav><a id="review-sidebar" href="./index.html"></a><a id="review-pin" href="./pin.html"></a><a id="review-capture" href="./capture.html"></a></nav>
    </header>
    <p class="review-note" id="review-note"></p>
    <div class="review-controls">
      <label><span id="scenario-label"></span><select id="scenario"><option value="available"></option><option value="installing"></option><option value="installed"></option><option value="failed"></option></select></label>
      <label><span id="platform-label"></span><select id="platform"><option value="appimage">Linux · AppImage</option><option value="macos">macOS</option><option value="windows">Windows</option><option value="deb">Linux · deb</option></select></label>
      <label>Language<select id="language"><option value="zh-CN">中文</option><option value="en">English</option></select></label>
      <label><span id="theme-label"></span><select id="theme"><option value="light"></option><option value="dark"></option></select></label>
      <button class="btn btn-small btn-secondary" id="reopen"></button>
    </div>
    <section class="review-update-stage" aria-label="Update dialog">
      <p class="review-update-background" id="review-background"></p>
      <!-- 与生产入口相同的 DOM、样式及 update-modal 控制器。 -->
      <div id="update-modal" class="update-modal hidden">
        <div class="update-modal-backdrop"></div>
        <div class="update-modal-content">
          <h2 id="update-title" class="update-modal-title" data-i18n="update.title">Update Available</h2>
          <div class="update-modal-version"><span id="update-version"></span></div>
          <div id="update-body" class="update-modal-body"></div>
          <div id="update-progress" class="update-modal-progress hidden">
            <div class="update-progress-track"><div id="update-progress-bar" class="update-progress-fill"></div></div>
            <span id="update-progress-text" class="update-progress-text">0%</span>
          </div>
          <div class="update-modal-actions">
            <button id="update-btn-skip" class="btn btn-small btn-secondary" data-i18n="update.skip">Skip this version</button>
            <button id="update-btn-later" class="btn btn-small btn-secondary" data-i18n="update.later">Later</button>
            <button id="update-btn-install" class="btn btn-small btn-primary" data-i18n="update.install">Install</button>
            <button id="update-btn-close" class="btn btn-small btn-secondary hidden" data-i18n="update.close">Close</button>
            <button id="update-btn-download" class="btn btn-small btn-primary hidden" data-i18n="update.download">Download</button>
          </div>
        </div>
      </div>
    </section>
    <p class="review-feedback" role="status" id="feedback"></p>
    <section class="review-conflict"><h2 id="conflict-title"></h2><p id="conflict-message" role="alert"></p></section>
  </main>
  <script type="module" src="./states.js"></script>
</body>
</html>
