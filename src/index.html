<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clippy</title>
  <!-- 主题变量必须最先加载，以免组件样式引用未定义的自定义属性 -->
  <link rel="stylesheet" href="styles/themes.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div id="app">
    <!-- 左侧：剪贴板列表面板 -->
    <div id="list-panel" class="list-panel">
    <!-- 搜索条（默认隐藏，焦点在第 1 行按 ↑/W 召唤） -->
    <aside id="search-bar" class="search-bar" hidden>
      <span class="search-bar-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input
        id="search-input"
        class="search-bar-input"
        type="text"
        data-i18n="search.placeholder"
        data-i18n-attr="placeholder"
        placeholder="Search clipboard history..."
        autocomplete="off"
        spellcheck="false"
      />
      <span class="search-bar-hint" data-i18n="search.escHint">Esc</span>
    </aside>

    <!-- 剪贴板列表 -->
    <main
      id="clip-list"
      class="clip-list"
      role="listbox"
      aria-label="Clipboard history"
    ></main>

    <!-- 空状态 -->
    <div id="empty-state" class="empty-state" hidden>
      <span class="empty-state-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></span>
      <span id="empty-state-text" data-i18n="empty.text">No clipboard items yet</span>
    </div>

    <!-- 底部 segment（All / Favorites） -->
    <footer id="segment-tabs" class="segment-tabs" role="tablist"></footer>
    </div><!-- /list-panel -->

    <!-- 右侧：富文本预览面板（默认隐藏） -->
    <div id="preview-panel" class="preview-panel hidden">
      <div class="preview-header">
        <span id="preview-type-badge" class="preview-type-badge"></span>
        <span id="preview-meta" class="preview-meta"></span>
      </div>
      <div id="preview-content" class="preview-content"></div>
    </div>

    <!-- 更新弹窗（默认隐藏） -->
    <div id="update-modal" class="update-modal hidden">
      <div class="update-modal-backdrop"></div>
      <div class="update-modal-content">
        <h2 id="update-title" class="update-modal-title" data-i18n="update.title">Update Available</h2>
        <div class="update-modal-version">
          <span id="update-version"></span>
        </div>
        <div id="update-body" class="update-modal-body"></div>
        <div id="update-progress" class="update-modal-progress hidden">
          <div class="update-progress-track">
            <div id="update-progress-bar" class="update-progress-fill"></div>
          </div>
          <span id="update-progress-text" class="update-progress-text">0%</span>
        </div>
        <div class="update-modal-actions">
          <button id="update-btn-skip" class="btn btn-small btn-secondary" data-i18n="update.skip">Skip this version</button>
          <button id="update-btn-later" class="btn btn-small btn-secondary" data-i18n="update.later">Later</button>
          <button id="update-btn-install" class="btn btn-small btn-primary" data-i18n="update.install">Install</button>
          <button id="update-btn-close" class="btn btn-small btn-secondary hidden" data-i18n="update.close">Close</button>
          <button id="update-btn-download" class="btn btn-small btn-primary hidden" data-i18n="update.download">Download</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
