<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clippy</title>
  <!-- 主题变量必须最先加载，以免组件样式引用未定义的自定义属性 -->
  <link rel="stylesheet" href="styles/themes.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div id="app">
    <!-- 搜索条（默认隐藏，焦点在第 1 行按 ↑/W 召唤） -->
    <aside id="search-bar" class="search-bar" hidden>
      <span class="search-bar-icon" aria-hidden="true">🔍</span>
      <input
        id="search-input"
        class="search-bar-input"
        type="text"
        data-i18n="search.placeholder"
        data-i18n-attr="placeholder"
        placeholder="Search clipboard history..."
        autocomplete="off"
        spellcheck="false"
      />
      <span class="search-bar-hint" data-i18n="search.escHint">Esc</span>
    </aside>

    <!-- 剪贴板列表 -->
    <main
      id="clip-list"
      class="clip-list"
      role="listbox"
      aria-label="Clipboard history"
    ></main>

    <!-- 空状态 -->
    <div id="empty-state" class="empty-state" hidden>
      <span class="empty-state-icon" aria-hidden="true">📋</span>
      <span id="empty-state-text" data-i18n="empty.text">No clipboard items yet</span>
    </div>

    <!-- 底部 segment（All / Favorites） -->
    <footer id="segment-tabs" class="segment-tabs" role="tablist"></footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
