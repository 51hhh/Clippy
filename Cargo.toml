[workspace]
members = [
    "crates/clippy-core",
    "crates/clippy-platform",
    "apps/legacy-tauri/native",
    "apps/legacy-tauri/native/vendor/arboard",
    "apps/slint",
]
default-members = [
    "crates/clippy-core",
    "crates/clippy-platform",
    "apps/legacy-tauri/native",
    "apps/slint",
]
exclude = [
    "apps/legacy-tauri/native/vendor/libspa",
    "apps/legacy-tauri/native/vendor/xcap",
]
resolver = "2"

[patch.crates-io]
# 上游 v2 分支已把 Windows updater 的 zip 依赖升级到 9，但尚未重新发布 crates.io 包。
# 固定提交避免分支漂移；上游发布含该改动的新版本后移除此补丁。
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace.git", rev = "11211c30e71796cd737280303244552bb7f70797" }
libspa = { path = "apps/legacy-tauri/native/vendor/libspa" }
# X11 写完成屏障与有界 INCR 大图传输；补丁范围见 vendor/arboard/PATCHES.md。
arboard = { path = "apps/legacy-tauri/native/vendor/arboard" }
# Windows WGC 录制必须包含光标；补丁范围见 vendor/xcap/PATCHES.md。
xcap = { path = "apps/legacy-tauri/native/vendor/xcap" }
# VP9 原型只接受仓库固定 SHA-256 的 libvpx 预编译归档；补丁范围见 vendor/shiguredo_libvpx/PATCHES.md。
shiguredo_libvpx = { path = "apps/legacy-tauri/native/vendor/shiguredo_libvpx" }
# libwebm 已有 Opus delay/pre-roll/尾裁切能力；补丁只把这些能力暴露给 Rust。
webm = { path = "apps/legacy-tauri/native/vendor/webm" }
webm-sys = { path = "apps/legacy-tauri/native/vendor/webm-sys" }

# 基准需要优化后的代码，但不需要 release 那套为发布体积服务的 lto = "fat" +
# 单 codegen-unit（会让每次 cargo bench 的编译时间高到没人愿意跑）。
[profile.bench]
lto = false
codegen-units = 16

# dev 下保留行号与回溯，同时避免把纯 debug 的截图、PNG 延迟误判为产品回归。
[profile.dev]
opt-level = 1

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
